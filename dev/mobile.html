<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Auditoría móvil · Avivando el Fuego</title>
<style>
  body{margin:0;background:#0a0512;display:flex;gap:30px;justify-content:center;align-items:flex-start;padding:24px;font-family:system-ui,sans-serif}
  .phone{width:390px;height:844px;border:10px solid #1d1430;border-radius:38px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;background:#0a0312}
  .phone iframe{width:390px;height:824px;border:0;display:block}
  .label{color:#ffb066;font-size:13px;text-align:center;margin-bottom:8px;letter-spacing:1px}
  .col{display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
  <div class="col"><div class="label">iPhone 390×844 — top</div>
    <div class="phone"><iframe data-src="preview.html?afmobile=1"></iframe></div>
  </div>
  <div class="col"><div class="label">iPhone 390×844 — scroll</div>
    <div class="phone"><iframe data-src="preview.html?afmobile=1"></iframe></div>
  </div>
  <script>
    // cache-buster: cada carga trae preview.html (y por dentro CSS/JS) frescos
    var t = Date.now();
    document.querySelectorAll('iframe').forEach(function (f) { f.src = f.dataset.src + '&cb=' + t; });
  </script>
</body>
</html>
