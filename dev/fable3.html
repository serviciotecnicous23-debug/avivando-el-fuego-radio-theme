<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FABLE v11 · AVIVA EL FUEGO (estándar 2026)</title>
<script>
  document.write('<link rel="stylesheet" href="../avivando_custom.css?t=' + Date.now() + '">');
  document.write('<link rel="stylesheet" href="avivando_fable3.css?t=' + Date.now() + '">');
</script>
<style>
  body{margin:0}
  .public-page{max-width:560px;margin:18px auto 60px;padding:0 14px}
  .card{padding:18px}
  .np-row{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .now-playing-title{font-size:18px;margin:0}
  .now-playing-artist{margin:2px 0 0}
  .controls{display:flex;align-items:center;gap:14px;margin-top:8px}
  .radio-control-play-button{width:60px;height:60px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
  .links{display:flex;gap:18px;margin-top:14px;font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .powered{text-align:center;font-size:12px;margin:22px 0 0}
</style>
</head>
<body class="page-minimal page-station-public-player station-avivando_el_fuego">
<main>
  <div class="public-page">
    <div class="card">
      <h2 class="now-playing-title-h">Avivando el Fuego Radio</h2>
      <div class="np-row">
        <a class="album-art" href="#"><img class="album_art" width="84" height="84" alt="art"
           src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='84' height='84'%3E%3Crect width='84' height='84' fill='%23b97f33'/%3E%3C/svg%3E"></a>
        <div>
          <p class="now-playing-title">Donde Está El Espíritu de Dios</p>
          <p class="now-playing-artist">Christine D'Clario</p>
        </div>
      </div>
      <div class="controls">
        <button class="btn p-0 radio-control-play-button btn-xl" aria-label="Play">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn p-0 text-secondary" aria-label="Mute">🔊</button>
        <input type="range" class="form-range" min="0" max="100" value="80" style="flex:1">
      </div>
      <div class="links"><a href="#">Song history</a><a href="#">Playlist</a></div>
    </div>
    <p class="powered">Powered by AzuraCast</p>
  </div>
</main>
<audio></audio>
<script>(function(){var s=document.createElement('script');s.src='avivando_fable3.js?t='+Date.now();document.body.appendChild(s);})();</script>
</body>
</html>
